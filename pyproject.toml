[project]
name = "pokemon-champions-sim"
version = "0.1.0"
description = "Monte Carlo battle simulator for Pokemon Champions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
